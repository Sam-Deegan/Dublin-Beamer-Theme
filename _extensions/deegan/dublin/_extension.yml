title: Dublin — a modernised Beamer template for academic use
author: Sam Deegan
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    beamer:
      # pdflatex, because the theme uses the IBM Plex LaTeX packages rather
      # than fontspec. Switch to xelatex only if you also swap the font
      # block in dublin-theme.tex.
      pdf-engine: pdflatex
      aspectratio: 169
      classoption:
        - t          # top-align frame content, like a document page
      fontsize: 10pt
      theme: default
      colortheme: default
      fonttheme: professionalfonts
      navigation: empty
      section-titles: false      # dividers come from the theme's AtBeginSection
      slide-level: 2
      incremental: false
      filters:
        - dublin-blocks.lua
      include-in-header:
        - dublin-theme.tex
        - dublin-components.tex
      header-includes: |
        \setbeamertemplate{caption}{\insertcaption}
